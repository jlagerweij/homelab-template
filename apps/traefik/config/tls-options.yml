# Generated by `just mtls-client-add` / `just mtls-client-revoke` — don't hand-edit.
# Until you issue a client cert, mtls-clients@file trusts nothing.
tls:
  options:
    mtls-clients:
      minVersion: VersionTLS12
      clientAuth:
        caFiles:
        clientAuthType: RequireAndVerifyClientCert
